# Purpose: run the project's automated checks whenever code is pushed or proposed in a PR.
# Headless drivers exercise graphics code on CI machines without opening desktop windows.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Check both the minimum supported Python version and the local development version.
        python-version: ["3.12", "3.14"]
    env:
      # Pygame uses dummy display/audio devices; Matplotlib writes figures through Agg.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      # Pinned dependencies make CI failures reproducible with the development environment.
      - run: python -m pip install -r requirements.lock
      # Exercise game rules, persistence, models, and both interfaces before accepting changes.
      - run: python -m pytest -q
      # Also confirm that the public CLI entry point imports and exposes its commands.
      - run: python main.py --help
